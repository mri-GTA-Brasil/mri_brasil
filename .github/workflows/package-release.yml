# Zipa cada pacote instalável e publica como asset numa Release (download direto).
# Gera web/public/packages.json (tamanho + URL de cada zip) para o site.
name: Empacotar pacotes (Release)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TAG: packages

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Zipar cada pacote
        run: |
          mkdir -p /tmp/zips
          cd "resource/[mri_brasil]"
          for d in mri_brasil_*/ ; do
            name="${d%/}"
            zip -r -q "/tmp/zips/${name}.zip" "$name"
            echo "✓ ${name}.zip  $(du -h /tmp/zips/${name}.zip | cut -f1)"
          done

          # Pacotões combinados (baixar tudo de uma vez, 1 arquivo)
          DUB="mri_brasil_s_full_amb_m mri_brasil_s_full_amb_f mri_brasil_s_full_ser mri_brasil_s_full_gan mri_brasil_police_scanner_p1 mri_brasil_police_scanner_p2 mri_brasil_police_scanner_p3 mri_brasil_oneshot_ambience mri_brasil_streamed_ambience_p1 mri_brasil_streamed_ambience_p2"
          AMB="mri_brasil_props mri_brasil_peds_policia mri_brasil_viaturas mri_brasil_correios mri_brasil_mapa_aeroporto mri_brasil_mapa_zancudo"
          zip -r -q /tmp/zips/mri_brasil_completo.zip mri_brasil_*
          zip -r -q /tmp/zips/mri_brasil_dublagem.zip $DUB
          zip -r -q /tmp/zips/mri_brasil_ambientacao.zip $AMB
          echo "combinados:"; du -h /tmp/zips/mri_brasil_completo.zip /tmp/zips/mri_brasil_dublagem.zip /tmp/zips/mri_brasil_ambientacao.zip
          ls -la /tmp/zips

      - name: Publicar/atualizar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Pacotes mri Brasil (instaláveis)" \
              --notes "Zips prontos de cada pacote. Baixe pelo site: https://mri-gta-brasil.github.io/mri_brasil/" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" /tmp/zips/*.zip --clobber

      - name: Gerar packages.json
        run: |
          python3 - << 'PYEOF'
          import os, json

          REPO = "mri-GTA-Brasil/mri_brasil"
          TAG = os.environ["TAG"]
          ZIPS = "/tmp/zips"

          # id -> (categoria, nome, descrição)
          META = {
            "mri_brasil_s_full_amb_m": ("dublagem", "NPCs ambientes — masculino", "Falas de pedestres e personagens masculinos do mundo aberto."),
            "mri_brasil_s_full_amb_f": ("dublagem", "NPCs ambientes — feminino", "Falas de pedestres e personagens femininos do mundo aberto."),
            "mri_brasil_s_full_ser": ("dublagem", "NPCs de serviço", "Polícia, bombeiros, SWAT, pilotos, seguranças e afins."),
            "mri_brasil_s_full_gan": ("dublagem", "Gangues", "Ballas, Families, Lost MC e demais facções."),
            "mri_brasil_police_scanner_p1": ("dublagem", "Scanner da polícia (1/3)", "Rádio e despacho policial — parte 1."),
            "mri_brasil_police_scanner_p2": ("dublagem", "Scanner da polícia (2/3)", "Rádio e despacho policial — parte 2."),
            "mri_brasil_police_scanner_p3": ("dublagem", "Scanner da polícia (3/3)", "Rádio e despacho policial — parte 3."),
            "mri_brasil_oneshot_ambience": ("dublagem", "Ambiente pontual", "Anúncios de aeroporto, veículos distantes, efeitos pontuais."),
            "mri_brasil_streamed_ambience_p1": ("dublagem", "Ambiente streaming (1/2)", "Sons de ambiente contínuos — parte 1."),
            "mri_brasil_streamed_ambience_p2": ("dublagem", "Ambiente streaming (2/2)", "Sons de ambiente contínuos — parte 2."),
            "mri_brasil_props": ("ambientacao", "Props & cenário", "Placas de rua, mobiliário urbano, bandeiras de SP e dos times, semáforos, pedágios."),
            "mri_brasil_peds_policia": ("ambientacao", "Polícia, forças & torcidas", "Skins da PM-SP, PC, PF, ROCAM, COE, exército, SAMU — e torcedores paulistas (Corinthians, Palmeiras…)."),
            "mri_brasil_viaturas": ("ambientacao", "Viaturas", "Liveries de viaturas da PM-SP e polícia federal."),
            "mri_brasil_correios": ("ambientacao", "Correios", "Skins de carteiro e van dos Correios."),
            "mri_brasil_mapa_aeroporto": ("ambientacao", "Aeroporto", "Retextura da área do aeroporto no clima brasileiro."),
            "mri_brasil_mapa_zancudo": ("ambientacao", "Fort Zancudo", "Retextura da base militar."),
          }

          def url(fn):
              return f"https://github.com/{REPO}/releases/download/{TAG}/{fn}"
          def size(fn):
              p = os.path.join(ZIPS, fn)
              return os.path.getsize(p) if os.path.exists(p) else 0

          # packages.json — só os 16 pacotes reais (na ordem do META)
          pkgs = []
          for pid, (cat, name, desc) in META.items():
              fn = f"{pid}.zip"
              if not os.path.exists(os.path.join(ZIPS, fn)):
                  continue
              pkgs.append({"id": pid, "category": cat, "name": name, "desc": desc,
                           "size": size(fn), "url": url(fn)})

          os.makedirs("web/public", exist_ok=True)
          with open("web/public/packages.json", "w", encoding="utf-8") as f:
              json.dump(pkgs, f, ensure_ascii=False, separators=(",", ":"))

          # bundles.json — pacotões combinados (baixar tudo de uma vez)
          dub = [p for p, m in META.items() if m[0] == "dublagem"]
          amb = [p for p, m in META.items() if m[0] == "ambientacao"]
          BUNDLES = [
              ("mri_brasil_completo", "Tudo", [p for p in META], "todos os pacotes num único arquivo"),
              ("mri_brasil_dublagem", "Só dublagem", dub, "todos os pacotes de voz"),
              ("mri_brasil_ambientacao", "Só ambientação", amb, "props, personagens, viaturas e mapas"),
          ]
          bundles = []
          for bid, label, ids, desc in BUNDLES:
              fn = f"{bid}.zip"
              if not os.path.exists(os.path.join(ZIPS, fn)):
                  continue
              bundles.append({"id": bid, "label": label, "desc": desc,
                              "size": size(fn), "url": url(fn), "packages": ids})
          with open("web/public/bundles.json", "w", encoding="utf-8") as f:
              json.dump(bundles, f, ensure_ascii=False, separators=(",", ":"))

          print(f"packages.json: {len(pkgs)} · bundles.json: {len(bundles)}")
          PYEOF

      - name: Commit packages.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: packages.json + bundles.json (zips da release)"
          file_pattern: "web/public/packages.json web/public/bundles.json"
          commit_user_name: mur4i
          commit_user_email: "89431075+mur4i@users.noreply.github.com"
