# Probe temporário: valida pipeline completo (vgmstream → ffmpeg opus → langdetect).
name: Probe vgmstream

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install faster-whisper
        run: pip install -q faster-whisper

      - name: Download vgmstream-cli
        run: |
          RELEASE=$(curl -s https://api.github.com/repos/vgmstream/vgmstream/releases/latest)
          URL=$(echo "$RELEASE" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for a in d.get('assets', []):
              n = a['name'].lower()
              if 'linux' in n and n.endswith('.zip'):
                  print(a['browser_download_url']); break
          ")
          wget -q "$URL" -O vgmstream.zip
          unzip -q vgmstream.zip -d vgmstream_bin
          BIN=$(find vgmstream_bin -name "vgmstream-cli" -type f | head -1)
          chmod +x "$BIN"; cp "$BIN" ./vgmstream-cli

      - name: Extrair WAVs de 2 arquivos (cop=PT? / amb_m=EN?)
        run: |
          COP="resource/[mri_brasil]/mri_brasil_s_full_ser/sfx/S_FULL_SER/s_m_y_cop_01_white_full_01.awc"
          AMB=$(git ls-files "resource/[mri_brasil]/mri_brasil_s_full_amb_m" | grep "\.awc$" | head -1)
          echo "AMB = $AMB"
          mkdir -p wav_cop wav_amb ogg
          ./vgmstream-cli -S 0 -o "wav_cop/?03s.wav" "$COP" > /dev/null 2>&1
          ./vgmstream-cli -S 0 -o "wav_amb/?03s.wav" "$AMB" > /dev/null 2>&1
          echo "cop WAVs: $(ls wav_cop/*.wav | wc -l) | amb WAVs: $(ls wav_amb/*.wav | wc -l)"
          # tamanho opus
          ffmpeg -nostdin -loglevel error -y -i "wav_cop/001.wav" -c:a libopus -b:a 16k -application voip "ogg/x.ogg"
          echo "opus exemplo: $(stat -c%s ogg/x.ogg) bytes"

      - name: Detectar idioma (base, P(pt) vs P(en))
        run: |
          python3 - << 'PYEOF'
          import os, glob, time
          from faster_whisper import WhisperModel, decode_audio

          model = WhisperModel("base", device="cpu", compute_type="int8")

          def classify(path):
              audio = decode_audio(path)
              # all_probs: lista [(lang, prob), ...] sobre todos os idiomas
              lang, prob, all_probs = model.detect_language(audio)
              d = dict(all_probs)
              ppt, pen = d.get("pt", 0.0), d.get("en", 0.0)
              if max(ppt, pen) < 0.30:
                  verdict = "?"   # provavel nao-fala/ruido
              else:
                  verdict = "PT" if ppt >= pen else "EN"
              return ppt, pen, lang, prob, verdict

          for label, folder in [("COP (esperado PT)", "wav_cop"), ("AMB_M (esperado EN)", "wav_amb")]:
              wavs = sorted(glob.glob(f"{folder}/*.wav"))[:15]
              print(f"\n=== {label} — {len(wavs)} clipes ===")
              t0 = time.time()
              for w in wavs:
                  ppt, pen, lang, prob, verdict = classify(w)
                  print(f"  {os.path.basename(w)}: {verdict:2s}  P(pt)={ppt:.2f} P(en)={pen:.2f}  [top={lang} {prob:.2f}]")
              dt = time.time() - t0
              print(f"  -> {dt/len(wavs):.2f}s/clipe")
          PYEOF
